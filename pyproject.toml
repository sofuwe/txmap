[project]
name = "txmap"
version = "0.1.0"
description = "Map bank transactions to labels"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
# `uv sync --extra llm` enables `--llm` (Claude names descriptors with no close match)
llm = ["anthropic"]

[project.scripts]
txmap = "txmap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["txmap"]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py313"
line-length = 120
